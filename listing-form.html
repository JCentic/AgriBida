<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgriBida — Create or Edit Listing</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Shared header: app name -->
  <header class="site-header">
    <div class="site-header__bar">
      <h1 class="site-header__title">AgriBida</h1>
      <p class="site-header__tagline">Produce bidding &amp; price transparency for Filipino farmers</p>
    </div>
  </header>

  <!-- Shared navigation area: populated by renderSiteNav() in js/script.js -->
  <nav class="site-nav" aria-label="Main navigation">
    <div class="site-nav__content" id="site-nav-content">
      <p class="site-nav__placeholder">Navigation appears here after you sign in.</p>
    </div>
  </nav>

  <main class="site-main" id="main-content">
    <section class="auth-card form-card" aria-labelledby="form-heading">
      <h2 id="form-heading">Create Produce Listing</h2>
      <p class="auth-subtitle" id="form-subtitle">Enter the details for the produce you want to list.</p>

      <form id="listing-form" class="auth-form" novalidate>
        <div class="field">
          <label for="listing-produce-name">Produce name</label>
          <input type="text" id="listing-produce-name" name="produceName" aria-describedby="listing-produce-name-error" />
          <p class="field-error" id="listing-produce-name-error" role="alert"></p>
        </div>

        <div class="field">
          <label for="listing-quantity">Quantity</label>
          <input type="number" id="listing-quantity" name="quantity" step="any" aria-describedby="listing-quantity-error" />
          <p class="field-error" id="listing-quantity-error" role="alert"></p>
        </div>

        <div class="field">
          <label for="listing-unit">Unit</label>
          <select id="listing-unit" name="unit" aria-describedby="listing-unit-error">
            <option value="" selected>Select a unit</option>
            <option value="kg">kg</option>
            <option value="sack">sack</option>
            <option value="piece">piece</option>
          </select>
          <p class="field-error" id="listing-unit-error" role="alert"></p>
        </div>

        <div class="field">
          <label for="listing-location">Location</label>
          <input type="text" id="listing-location" name="location" autocomplete="address-level2" aria-describedby="listing-location-error" />
          <p class="field-error" id="listing-location-error" role="alert"></p>
        </div>

        <div class="field">
          <label for="listing-price">Preferred price (₱ per unit)</label>
          <input type="number" id="listing-price" name="preferredPrice" step="any" aria-describedby="listing-price-error" />
          <p class="field-error" id="listing-price-error" role="alert"></p>
        </div>

        <div class="field">
          <label for="listing-date">Availability date</label>
          <input type="date" id="listing-date" name="availabilityDate" aria-describedby="listing-date-error" />
          <p class="field-error" id="listing-date-error" role="alert"></p>
        </div>

        <p class="form-error" id="listing-form-error" role="alert"></p>

        <div class="form-actions">
          <a href="farmer-dashboard.html" class="btn btn--secondary btn--block">Cancel</a>
          <button type="submit" class="btn btn--primary btn--block" id="listing-submit-btn">Save Listing</button>
        </div>
      </form>
    </section>
  </main>

  <!-- Footer / notification area -->
  <footer class="site-footer">
    <div id="notification-area" class="notification-area" role="status" aria-live="polite"></div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/script.js"></script>
  <script src="js/farmer.js"></script>
</body>
</html>
