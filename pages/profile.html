<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgriBida — Profile</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <!-- Shared header: app name -->
  <header class="site-header">
    <div class="site-header__bar">
      <h1 class="site-header__title">AgriBida</h1>
      <p class="site-header__tagline">Produce bidding &amp; price transparency for Filipino farmers</p>
    </div>
  </header>

  <!-- Shared navigation area: populated by renderSiteNav() in js/script.js -->
  <nav class="site-nav" aria-label="Main navigation">
    <div class="site-nav__content" id="site-nav-content">
      <p class="site-nav__placeholder">Navigation appears here after you sign in.</p>
    </div>
  </nav>

  <main class="site-main" id="main-content">
    <div class="page">
      <div class="page-header">
        <div>
          <h2>Profile</h2>
          <p class="page-subtitle">Your account details and sample credibility record.</p>
        </div>
      </div>

      <section class="page-section" aria-labelledby="account-heading">
        <div class="page-section__header">
          <h3 id="account-heading">Account</h3>
          <button type="button" class="btn btn--secondary btn--small" id="profile-account-edit-btn" aria-expanded="false">Edit</button>
        </div>
        <div class="card profile-summary" id="profile-account-card"></div>
      </section>

      <section class="page-section" id="profile-role-section" aria-labelledby="role-heading" hidden>
        <h3 id="role-heading"></h3>
        <div class="card profile-summary" id="profile-role-card"></div>
      </section>
    </div>
  </main>

  <!-- Footer / notification area -->
  <footer class="site-footer">
    <div id="notification-area" class="notification-area" role="status" aria-live="polite"></div>
  </footer>

  <!-- Buyer verification modal: markup stays static here; js/profile.js fills in
       #verification-modal-body and calls showModal()/close() when the "Verify
       Account" / "Update Verification Document" button is clicked. A native <dialog>
       gets focus trapping, Escape-to-close, and backdrop rendering for free. -->
  <dialog class="modal" id="verification-modal" aria-labelledby="verification-modal-heading">
    <div class="modal__header">
      <h3 id="verification-modal-heading">Verify Account</h3>
      <button type="button" class="modal__close" id="verification-modal-close-btn" aria-label="Close">&times;</button>
    </div>
    <div class="modal__body" id="verification-modal-body"></div>
  </dialog>

  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/script.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/profile.js"></script>
</body>
</html>
