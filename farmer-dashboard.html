<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgriBida — Farmer Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Shared header: app name -->
  <header class="site-header">
    <div class="site-header__bar">
      <h1 class="site-header__title">AgriBida</h1>
      <p class="site-header__tagline">Produce bidding &amp; price transparency for Filipino farmers</p>
    </div>
  </header>

  <!-- Shared navigation area: populated by renderSiteNav() in js/script.js -->
  <nav class="site-nav" aria-label="Main navigation">
    <div class="site-nav__content" id="site-nav-content">
      <p class="site-nav__placeholder">Navigation appears here after you sign in.</p>
    </div>
  </nav>

  <main class="site-main site-main--wide" id="main-content">
    <div class="page">
      <div class="page-header">
        <div>
          <h2>Farmer Dashboard</h2>
          <p class="page-subtitle">A summary of your listings, recent bids, and sample market prices.</p>
        </div>
        <a href="listing-form.html" class="btn btn--primary">Create Listing</a>
      </div>

      <section class="page-section" aria-labelledby="listings-heading">
        <h3 id="listings-heading">Your Listings</h3>
        <div class="card-grid card-grid--listings" id="listings-container"></div>
      </section>

      <section class="page-section" aria-labelledby="bids-heading">
        <h3 id="bids-heading">Recent Bids</h3>
        <div class="card" id="recent-bids-container"></div>
      </section>

      <section class="page-section" aria-labelledby="prices-heading">
        <h3 id="prices-heading">Sample Market Prices</h3>
        <div class="card" id="price-summary-container"></div>
      </section>
    </div>
  </main>

  <!-- Footer / notification area -->
  <footer class="site-footer">
    <div id="notification-area" class="notification-area" role="status" aria-live="polite"></div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/script.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/farmer.js"></script>
</body>
</html>
